<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gait Dashboard</title>
<!--
  ME193 live gait dashboard. Open this file in a browser (double-click it).
  It subscribes (never publishes) to MQTT over WebSockets on broker.hivemq.com:
    ME193/ceci/gait/pred    {t, model1, model2, cadence_hz}   -> avatar, cards, cadence
    ME193/ceci/gait/raw     [{t, ax, ay, az, gx, gy, gz}, ...] -> accel plot, bike vs air-bike
    ME193/ceci/gait/status  {wall, t, rate_hz, ...}           -> connection indicator
  Test without the board: python laptop/simulator.py --random --pred
  Keys: F fullscreen. Add ?name=Ceci to the file URL to skip the start screen.
  Test mode: pick the true activity; every prediction that arrives while it is
  selected counts as right or wrong for each model (accuracy on the cards).
  "Switch player" returns to the name screen and resets the player; the MQTT
  connection stays open so the next player sees live data immediately.
  ?prefix=ME193/ceci/gait/test uses <prefix>/raw|pred|status instead (testing
  with simulator.py --topic ME193/ceci/gait/test/raw).
-->
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg: #f4f3f0;
    --surface: #fcfcfb;
    --border: #e4e3df;
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #8a8984;
    --figure: #1d1d1b;
    --series-1: #2a78d6;
    --c-standing: #2a78d6;
    --c-walking: #eb6834;
    --c-running: #1baf7a;
    --c-biking: #eda100;
    --ok: #23a04a;
    --warn: #d98a00;
    --bad: #d64545;
    --idle: #8a8984;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111110;
      --surface: #1a1a19;
      --border: #2e2e2b;
      --text: #f0efec;
      --text-2: #c3c2b7;
      --muted: #8f8e86;
      --figure: #f0efec;
      --series-1: #3987e5;
      --c-standing: #3987e5;
      --c-walking: #d95926;
      --c-running: #199e70;
      --c-biking: #c98500;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111110;
    --surface: #1a1a19;
    --border: #2e2e2b;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --muted: #8f8e86;
    --figure: #f0efec;
    --series-1: #3987e5;
    --c-standing: #3987e5;
    --c-walking: #d95926;
    --c-running: #199e70;
    --c-biking: #c98500;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }

  /* ---------- start screen ---------- */
  .start[hidden] { display: none; }
  .start {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding: 16px;
  }
  .start form {
    width: min(520px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: clamp(24px, 4vw, 48px);
    display: grid; gap: 16px;
  }
  .start h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.4rem); }
  .start label { font-size: 1.2rem; color: var(--text-2); }
  .start input {
    font-size: 1.6rem; padding: 14px 16px;
    border: 2px solid var(--border); border-radius: 12px;
    background: var(--bg);
  }
  .start input:focus { outline: none; border-color: var(--series-1); }
  .start button {
    font-size: 1.4rem; font-weight: 600; padding: 14px;
    border: 0; border-radius: 12px; cursor: pointer;
    background: var(--text); color: var(--bg);
  }
  .start .note { margin: 0; font-size: 0.95rem; color: var(--muted); }

  /* ---------- main layout ---------- */
  main {
    height: 100vh;
    padding: clamp(12px, 1.6vw, 28px);
    display: grid;
    gap: clamp(10px, 1.2vw, 20px);
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas:
      "head   head"
      "test   test"
      "avatar side"
      "models models";
  }
  main[hidden] { display: none; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: clamp(12px, 1.4vw, 24px);
    min-width: 0; min-height: 0;
  }
  .k {
    font-size: clamp(0.9rem, 1.3vw, 1.4rem);
    color: var(--text-2);
    font-weight: 500;
  }

  header {
    grid-area: head;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap;
  }
  .who { font-size: clamp(1.8rem, 3.6vw, 3.6rem); font-weight: 700; line-height: 1.05; }
  .sub { font-size: clamp(0.9rem, 1.2vw, 1.2rem); color: var(--muted); }
  .right { display: flex; align-items: center; gap: 12px; }
  .conn {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: clamp(1rem, 1.5vw, 1.5rem); font-weight: 600;
    padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
  }
  .conn .dot { width: 0.8em; height: 0.8em; border-radius: 50%; background: var(--idle); }
  .conn[data-state="ok"] .dot { background: var(--ok); }
  .conn[data-state="warn"] .dot { background: var(--warn); }
  .conn[data-state="bad"] .dot { background: var(--bad); }
  .conn[data-state="ok"] .dot { box-shadow: 0 0 0 0 var(--ok); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); }
    70% { box-shadow: 0 0 0 10px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .fs {
    font-size: clamp(0.9rem, 1.2vw, 1.2rem);
    padding: 8px 14px; border-radius: 10px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
  }

  .avatar { grid-area: avatar; position: relative; display: flex; flex-direction: column; }
  .avatar canvas { flex: 1; width: 100%; min-height: 0; display: block; }
  .caption {
    font-size: clamp(1.2rem, 2.2vw, 2.4rem); font-weight: 600;
    text-align: center; color: var(--text-2); padding-top: 6px;
  }

  .side { grid-area: side; display: flex; flex-direction: column; gap: clamp(10px, 1.2vw, 20px); min-height: 0; }
  .cadence .big {
    font-size: clamp(3rem, 7vw, 8rem); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; margin-top: 6px;
  }
  .cadence .unit { font-size: 0.32em; font-weight: 600; color: var(--text-2); }
  .plot { flex: 1; display: flex; flex-direction: column; min-height: 160px; }
  .plot canvas { flex: 1; width: 100%; min-height: 0; display: block; margin-top: 8px; }

  .models {
    grid-area: models;
    display: grid; grid-template-columns: 1fr 1fr; gap: clamp(10px, 1.2vw, 20px);
  }
  .model { border-left: 12px solid var(--accent, var(--border)); }
  .model .label {
    display: flex; align-items: center; gap: 0.35em;
    font-size: clamp(2.2rem, 5.2vw, 5.6rem); font-weight: 800; line-height: 1.1;
    margin-top: 4px;
  }
  .model .swatch {
    width: 0.5em; height: 0.5em; border-radius: 50%;
    background: var(--accent, var(--border)); flex: none;
  }
  .model.stale .label { color: var(--muted); }
  .model .acc {
    margin-top: 6px;
    font-size: clamp(1.1rem, 2vw, 2.2rem); font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .model .acc .of { font-weight: 500; color: var(--text-2); }

  .testbar {
    grid-area: test;
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  .testbar .k { margin-right: 6px; }
  .testbar button {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: clamp(0.95rem, 1.3vw, 1.3rem); font-weight: 600;
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
    background: var(--surface); border: 2px solid var(--border);
  }
  .testbar button .swatch { width: 0.7em; height: 0.7em; border-radius: 50%; background: var(--accent); }
  .testbar button[aria-pressed="true"] { border-color: var(--text); background: var(--bg); }
  .testbar button[data-truth=""] { color: var(--text-2); }

  @media (max-width: 820px) {
    main {
      height: auto; min-height: 100vh;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto;
      grid-template-areas: "head" "test" "avatar" "models" "side";
    }
    .avatar { height: 55vh; }
    .models { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="start" class="start">
  <form id="startForm" autocomplete="off">
    <h1>Gait classifier</h1>
    <label for="nameInput">Enter your name</label>
    <input id="nameInput" maxlength="40" required autofocus>
    <button type="submit">Start</button>
    <p class="note">Your name only appears on this screen. It is never sent anywhere.</p>
  </form>
</div>

<main id="app" hidden>
  <header>
    <div>
      <div class="who" id="who"></div>
      <div class="sub">Live gait classifier · ME193</div>
    </div>
    <div class="right">
      <div id="conn" class="conn" data-state="idle" role="status" aria-live="polite">
        <span class="dot"></span><span id="connText">Connecting…</span>
      </div>
      <button id="switchBtn" class="fs" type="button" title="Back to the name screen for the next player">Switch player</button>
      <button id="fsBtn" class="fs" type="button" title="Fullscreen (F)">Fullscreen</button>
    </div>
  </header>

  <section class="testbar" aria-label="Test mode">
    <span class="k">Test mode, true activity:</span>
    <button type="button" data-truth="standing" aria-pressed="false" style="--accent: var(--c-standing)"><span class="swatch"></span>Standing</button>
    <button type="button" data-truth="walking" aria-pressed="false" style="--accent: var(--c-walking)"><span class="swatch"></span>Walking</button>
    <button type="button" data-truth="running" aria-pressed="false" style="--accent: var(--c-running)"><span class="swatch"></span>Running</button>
    <button type="button" data-truth="biking" aria-pressed="false" style="--accent: var(--c-biking)"><span class="swatch"></span>Biking</button>
    <button type="button" data-truth="" aria-pressed="true">Off</button>
  </section>

  <section class="avatar card" aria-label="Avatar driven by Model 2">
    <canvas id="avatar"></canvas>
    <div id="caption" class="caption">Waiting for predictions…</div>
  </section>

  <section class="side">
    <div class="card cadence">
      <div class="k">Cadence</div>
      <div class="big"><span id="cadVal">—</span> <span id="cadUnit" class="unit"></span></div>
    </div>
    <div class="card plot">
      <div class="k">Accel magnitude (g), last 10 s</div>
      <canvas id="plot" aria-label="Accel magnitude over the last 10 seconds"></canvas>
    </div>
  </section>

  <section class="models">
    <div class="card model stale" id="m1">
      <div class="k">Model 1: peak accel</div>
      <div class="label"><span class="swatch"></span><span class="txt" aria-live="polite">—</span></div>
      <div class="acc" hidden></div>
    </div>
    <div class="card model stale" id="m2">
      <div class="k">Model 2: all IMU</div>
      <div class="label"><span class="swatch"></span><span class="txt" aria-live="polite">—</span></div>
      <div class="acc" hidden></div>
    </div>
  </section>
</main>

<script>
// ===================== CONFIG =====================
const CONFIG = {
  brokerUrl: "wss://broker.hivemq.com:8884/mqtt",
  topics: {
    raw: "ME193/ceci/gait/raw",
    pred: "ME193/ceci/gait/pred",
    status: "ME193/ceci/gait/status",
  },
  plotSeconds: 10,
  bikeWindowMs: 2000,     // gravity direction for upright vs air-bike, from raw t
  airBikeBelowAx: -0.3,   // mean ax (g) below this -> lying on back (knee above hip)
  uprightAboveAx: 0.1,    // mean ax (g) above this -> sitting on a bike
  predStaleMs: 4000,      // no prediction for this long -> show "waiting"
  rawStaleMs: 2000,       // no raw samples for this long -> data not flowing
  statusStaleMs: 12000,   // board status comes every 5 s
  minRateHz: 45,
  cadenceTauS: 1.5,       // smoothing time constant for the animation speed
  blendMs: 600,           // pose change cross-fade
};

const testPrefix = new URLSearchParams(location.search).get("prefix");
if (testPrefix) {
  for (const k of Object.keys(CONFIG.topics)) CONFIG.topics[k] = `${testPrefix}/${k}`;
}

// ===================== HEAD PHOTO PLACEHOLDER =====================
// To show a face instead of the plain head circle: put a photo (roughly square,
// face centred) in the same folder as this file and set its name here, e.g.
//   const HEAD_PHOTO = "face.png";
// It is drawn clipped to the head circle. Leave "" for the plain head.
const HEAD_PHOTO = "";
// ==================================================================

const ACTIVITIES = {
  standing: { text: "Standing", color: "--c-standing" },
  walking:  { text: "Walking",  color: "--c-walking" },
  running:  { text: "Running",  color: "--c-running" },
  biking:   { text: "Biking",   color: "--c-biking" },
};
const DEFAULT_CADENCE = { walking: 0.9, running: 1.4, biking: 1.2 };

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ---------------- player (name stays in this object only) ----------------
// Everything that belongs to one player. "Switch player" replaces it with a
// fresh one, so per-player stats (and a per-player face photo) added here
// reset together.
function newPlayer(name) {
  return {
    name,
    photo: HEAD_PHOTO ? Object.assign(new Image(), { src: HEAD_PHOTO }) : null,
    // test mode: the true activity selected (null = off) and right/total per model
    test: { truth: null, m1: { right: 0, total: 0 }, m2: { right: 0, total: 0 } },
  };
}
let player = newPlayer("");

// ---------------- data stream state (shared by all players) ----------------
let client = null;
let mqttUp = false;
let pred = null, predAt = 0;
let status = null, statusAt = 0;
let rawAt = 0;
const raw = [];               // {t, mag, ax}
let bikeVariant = "upright";  // "upright" | "air"

// ---------------- start screen ----------------
let animating = false;

function start(name) {
  name = name.trim().slice(0, 40);
  if (!name) return;
  player = newPlayer(name);
  renderTest();
  $("who").textContent = player.name;
  $("start").hidden = true;
  $("app").hidden = false;
  if (!client) connect();          // once; kept open across players
  if (!animating) { animating = true; requestAnimationFrame(frame); }
}

function switchPlayer() {
  player = newPlayer("");
  renderTest();
  $("who").textContent = "";
  $("nameInput").value = "";
  $("app").hidden = true;
  $("start").hidden = false;
  $("nameInput").focus();
  // drop ?name= so a reload doesn't bring the previous player back
  const url = new URL(location.href);
  if (url.searchParams.has("name")) {
    url.searchParams.delete("name");
    history.replaceState(null, "", url);
  }
}
$("startForm").addEventListener("submit", (e) => { e.preventDefault(); start($("nameInput").value); });
$("switchBtn").addEventListener("click", switchPlayer);
const urlName = new URLSearchParams(location.search).get("name");
if (urlName) start(urlName);

// ---------------- fullscreen ----------------
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}
$("fsBtn").addEventListener("click", toggleFullscreen);
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "f" || e.key === "F") toggleFullscreen();
});
document.addEventListener("fullscreenchange", () => {
  $("fsBtn").textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
});

// ---------------- MQTT (subscribe only, never publish) ----------------
function connect() {
  const clientId = "me193dash_" + Math.random().toString(16).slice(2, 10);
  client = mqtt.connect(CONFIG.brokerUrl, {
    clientId, clean: true, reconnectPeriod: 2000, connectTimeout: 10000,
  });
  const decoder = new TextDecoder();
  client.on("connect", () => {
    mqttUp = true;
    client.subscribe(Object.values(CONFIG.topics));
  });
  client.on("close", () => { mqttUp = false; });
  client.on("offline", () => { mqttUp = false; });
  client.on("message", (topic, payload) => {
    let msg;
    try { msg = JSON.parse(decoder.decode(payload)); } catch { return; }
    const now = performance.now();
    if (topic === CONFIG.topics.raw && Array.isArray(msg)) onRaw(msg, now);
    else if (topic === CONFIG.topics.pred && msg && msg.model2) { pred = msg; predAt = now; scorePrediction(msg); }
    else if (topic === CONFIG.topics.status && msg) { status = msg; statusAt = now; }
  });
}

function onRaw(samples, now) {
  for (const s of samples) {
    if (typeof s.t !== "number") continue;
    if (raw.length && s.t <= raw[raw.length - 1].t) raw.length = 0;   // stream restarted
    raw.push({ t: s.t, mag: Math.hypot(s.ax, s.ay, s.az), ax: s.ax });
  }
  if (!raw.length) return;
  rawAt = now;
  const newest = raw[raw.length - 1].t;
  const keepFrom = newest - CONFIG.plotSeconds * 1000;
  let drop = 0;
  while (drop < raw.length && raw[drop].t < keepFrom) drop++;
  if (drop) raw.splice(0, drop);

  // Upright bike vs air-bike from where gravity points over the last ~2 s:
  // lying on your back with the knee above the hip turns body x (knee->hip) downward.
  let sum = 0, n = 0;
  for (let i = raw.length - 1; i >= 0 && raw[i].t >= newest - CONFIG.bikeWindowMs; i--) { sum += raw[i].ax; n++; }
  if (n) {
    const ax = sum / n;
    if (ax < CONFIG.airBikeBelowAx) bikeVariant = "air";
    else if (ax > CONFIG.uprightAboveAx) bikeVariant = "upright";
  }
}

// ---------------- test mode ----------------
// While a true activity is selected, each prediction that arrives counts once
// as right or wrong for each model. Counts live in player.test, so they carry
// across activity changes and reset on Switch player.
function scorePrediction(msg) {
  const test = player.test;
  if (!test.truth) return;
  for (const [key, label] of [["m1", msg.model1], ["m2", msg.model2]]) {
    test[key].total += 1;
    if (label === test.truth) test[key].right += 1;
  }
  renderTest();
}

function renderTest() {
  const test = player.test;
  for (const btn of document.querySelectorAll(".testbar button")) {
    btn.setAttribute("aria-pressed", String((btn.dataset.truth || null) === test.truth));
  }
  for (const key of ["m1", "m2"]) {
    const el = $(key).querySelector(".acc");
    const { right, total } = test[key];
    if (!total) {
      el.hidden = !test.truth;
      el.textContent = "Testing: waiting for predictions…";
      continue;
    }
    el.hidden = false;
    el.innerHTML = `${Math.round(100 * right / total)}% right <span class="of">(${right}/${total})${test.truth ? "" : " · paused"}</span>`;
  }
}

for (const btn of document.querySelectorAll(".testbar button")) {
  btn.addEventListener("click", () => {
    const truth = btn.dataset.truth || null;
    player.test.truth = player.test.truth === truth ? null : truth;   // click again to stop
    renderTest();
  });
}

// ---------------- connection indicator ----------------
function connectionState(now) {
  if (!mqttUp) return ["idle", "Connecting to broker…"];
  if (!status || now - statusAt > CONFIG.statusStaleMs) return ["bad", "No board"];
  if (now - rawAt > CONFIG.rawStaleMs) return ["warn", "Board up, no data"];
  const hz = status.rate_hz;
  if (typeof hz === "number" && hz < CONFIG.minRateHz) return ["warn", `Low rate ${hz.toFixed(0)} Hz`];
  return ["ok", `Live · ${typeof hz === "number" ? hz.toFixed(0) : "50"} Hz`];
}

// ---------------- cards + cadence ----------------
function predFresh(now) { return pred && now - predAt <= CONFIG.predStaleMs; }

function setCard(id, label) {
  const card = $(id), act = ACTIVITIES[label];
  const txt = act ? act.text : "—";
  const el = card.querySelector(".txt");
  if (el.textContent !== txt) el.textContent = txt;
  card.classList.toggle("stale", !act);
  card.style.setProperty("--accent", act ? `var(${act.color})` : "var(--border)");
}

function updatePanels(now) {
  const fresh = predFresh(now);
  setCard("m1", fresh ? pred.model1 : null);
  setCard("m2", fresh ? pred.model2 : null);

  let val = "—", unit = "";
  if (fresh && typeof pred.cadence_hz === "number" && pred.cadence_hz > 0) {
    if (pred.model2 === "walking" || pred.model2 === "running") {
      val = Math.round(2 * pred.cadence_hz * 60); unit = "steps/min";
    } else if (pred.model2 === "biking") {
      val = Math.round(pred.cadence_hz * 60); unit = "RPM";
    }
  }
  if ($("cadVal").textContent !== String(val)) $("cadVal").textContent = val;
  if ($("cadUnit").textContent !== unit) $("cadUnit").textContent = unit;

  let caption = "Waiting for predictions…";
  if (fresh) {
    caption = ACTIVITIES[pred.model2]?.text ?? pred.model2;
    if (pred.model2 === "biking") caption += bikeVariant === "air" ? " · on your back" : " · on a bike";
  }
  if ($("caption").textContent !== caption) $("caption").textContent = caption;

  const [state, text] = connectionState(now);
  const conn = $("conn");
  if (conn.dataset.state !== state) conn.dataset.state = state;
  if ($("connText").textContent !== text) $("connText").textContent = text;
}

// ---------------- avatar geometry (figure units, y up, facing +x) ----------------
const L = { torso: 0.52, neck: 0.07, head: 0.12, upper: 0.30, fore: 0.28, thigh: 0.46, shin: 0.46 };
const DEG = Math.PI / 180;
const P = (x, y) => ({ x, y });
// segment hanging from `from` at angle a (deg): 0 = straight down, + = forward
const down = (from, a, len) => P(from.x + len * Math.sin(a * DEG), from.y - len * Math.cos(a * DEG));
// segment rising from `from` at angle a (deg): 0 = straight up, + = forward
const up = (from, a, len) => P(from.x + len * Math.sin(a * DEG), from.y + len * Math.cos(a * DEG));

// Two-link inverse kinematics: middle joint between a and b.
// bend +1 rotates counter-clockwise from a->b (knee forward when the leg points down).
function ik(a, b, l1, l2, bend) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const d = Math.min(Math.max(Math.hypot(dx, dy), Math.abs(l1 - l2) + 1e-3), l1 + l2 - 1e-3);
  const alpha = Math.acos((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d));
  const ang = Math.atan2(dy, dx) + bend * alpha;
  return P(a.x + l1 * Math.cos(ang), a.y + l1 * Math.sin(ang));
}

// Limbs are always [far leg, near leg, far arm, near arm] so poses can blend.
function upright(hip, lean, legs, arms) {
  const shoulder = up(hip, lean, L.torso * 0.92);
  const neck = up(hip, lean, L.torso);
  const head = up(neck, lean, L.neck + L.head);
  const limbs = [];
  for (const [thigh, knee] of legs) {
    const j = down(hip, thigh, L.thigh);
    limbs.push({ a: hip, j, b: down(j, thigh - knee, L.shin) });
  }
  for (const [upper, elbow] of arms) {
    const j = down(shoulder, upper, L.upper);
    limbs.push({ a: shoulder, j, b: down(j, upper + elbow, L.fore) });
  }
  return { hip, shoulder, neck, head, limbs };
}

function shift(pose, dy) {
  const s = (p) => P(p.x, p.y + dy);
  return {
    hip: s(pose.hip), shoulder: s(pose.shoulder), neck: s(pose.neck), head: s(pose.head),
    limbs: pose.limbs.map((l) => ({ a: s(l.a), j: s(l.j), b: s(l.b) })),
  };
}
// Put the lowest foot on the ground (y = 0)
const grounded = (pose, extra = 0) => shift(pose, -Math.min(pose.limbs[0].b.y, pose.limbs[1].b.y) + extra);

const BIKE = {
  rear: P(-0.62, 0.34), front: P(0.66, 0.34), wheel: 0.34,
  crank: P(0, 0.36), crankR: 0.17, seat: P(-0.2, 1.0), bar: P(0.48, 1.08),
};
const AIR_CRANK = P(0.25, 0.66);

const POSES = {
  standing(ph) {
    const s = Math.sin(2 * Math.PI * ph);
    return grounded(upright(P(0.015 * s, 0), 1.5 * s, [[-3, 2], [3, 2]], [[-6 + 2 * s, 8], [6 - 2 * s, 10]]));
  },
  walking(ph) {
    const p = 2 * Math.PI * ph;
    const leg = (q) => [22 * Math.sin(q), 6 + 40 * Math.max(0, Math.cos(q))];
    const arm = (q) => [20 * Math.sin(q), 18 + 12 * Math.max(0, Math.sin(q))];
    // far leg is half a stride behind; each arm swings with the opposite leg
    return grounded(upright(P(0, 0), 3, [leg(p + Math.PI), leg(p)], [arm(p), arm(p + Math.PI)]));
  },
  running(ph) {
    const p = 2 * Math.PI * ph;
    const leg = (q) => [10 + 40 * Math.sin(q), 25 + 85 * Math.max(0, Math.cos(q))];
    const arm = (q) => [35 * Math.sin(q), 85];
    const bounce = 0.05 * Math.abs(Math.sin(2 * p));
    return grounded(upright(P(0, 0), 14, [leg(p + Math.PI), leg(p)], [arm(p), arm(p + Math.PI)]), bounce);
  },
  bike(ph) {
    const th = -2 * Math.PI * ph;   // cranks turn clockwise seen from this side
    const c = BIKE.crank, r = BIKE.crankR;
    const pedalNear = P(c.x + r * Math.cos(th), c.y + r * Math.sin(th));
    const pedalFar = P(c.x - r * Math.cos(th), c.y - r * Math.sin(th));
    const hip = P(BIKE.seat.x, BIKE.seat.y + 0.03);
    const lean = 38;
    const shoulder = up(hip, lean, L.torso * 0.92);
    const neck = up(hip, lean, L.torso);
    const head = up(neck, lean, L.neck + L.head);
    const elbow = ik(shoulder, BIKE.bar, L.upper, L.fore, -1);
    return {
      hip, shoulder, neck, head,
      limbs: [
        { a: hip, j: ik(hip, pedalFar, L.thigh, L.shin, 1), b: pedalFar },
        { a: hip, j: ik(hip, pedalNear, L.thigh, L.shin, 1), b: pedalNear },
        { a: shoulder, j: elbow, b: BIKE.bar },
        { a: shoulder, j: elbow, b: BIKE.bar },
      ],
    };
  },
  airbike(ph) {
    const th = -2 * Math.PI * ph;
    const c = AIR_CRANK, r = BIKE.crankR;
    const pedalNear = P(c.x + r * Math.cos(th), c.y + r * Math.sin(th));
    const pedalFar = P(c.x - r * Math.cos(th), c.y - r * Math.sin(th));
    const hip = P(0, 0.1);
    const lean = -84;   // torso lying back toward -x
    const shoulder = up(hip, lean, L.torso * 0.92);
    const neck = up(hip, lean, L.torso);
    const head = up(neck, lean, L.neck + L.head);
    const armOnFloor = () => {
      const j = down(shoulder, 72, L.upper);
      return { a: shoulder, j, b: down(j, 88, L.fore) };
    };
    return {
      hip, shoulder, neck, head,
      limbs: [
        { a: hip, j: ik(hip, pedalFar, L.thigh, L.shin, 1), b: pedalFar },
        { a: hip, j: ik(hip, pedalNear, L.thigh, L.shin, 1), b: pedalNear },
        armOnFloor(), armOnFloor(),
      ],
    };
  },
};

function lerpPose(a, b, k) {
  const l = (p, q) => P(p.x + (q.x - p.x) * k, p.y + (q.y - p.y) * k);
  return {
    hip: l(a.hip, b.hip), shoulder: l(a.shoulder, b.shoulder), neck: l(a.neck, b.neck), head: l(a.head, b.head),
    limbs: a.limbs.map((la, i) => ({ a: l(la.a, b.limbs[i].a), j: l(la.j, b.limbs[i].j), b: l(la.b, b.limbs[i].b) })),
  };
}

function poseName(now) {
  if (!predFresh(now)) return "standing";
  const m = pred.model2;
  if (m === "biking") return bikeVariant === "air" ? "airbike" : "bike";
  return POSES[m] ? m : "standing";
}

// ---------------- drawing ----------------

function fitCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
  const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  return dpr;
}

function drawAvatar(pose, bikeAlpha) {
  const cv = $("avatar"), ctx = cv.getContext("2d");
  fitCanvas(cv);
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const box = { x0: -1.15, x1: 1.15, y0: -0.08, y1: 2.0 };
  const s = Math.min(W / (box.x1 - box.x0), H / (box.y1 - box.y0));
  const ox = W / 2 - s * (box.x0 + box.x1) / 2;
  const oy = H / 2 + s * (box.y0 + box.y1) / 2;
  const X = (p) => ox + s * p.x, Y = (p) => oy - s * p.y;
  const line = (pts) => { ctx.beginPath(); ctx.moveTo(X(pts[0]), Y(pts[0])); for (const p of pts.slice(1)) ctx.lineTo(X(p), Y(p)); ctx.stroke(); };

  const fig = css("--figure"), border = css("--border"), muted = css("--muted");
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  // ground
  ctx.strokeStyle = border; ctx.lineWidth = Math.max(2, 0.02 * s);
  line([P(box.x0, 0), P(box.x1, 0)]);

  // bike (fades in and out)
  if (bikeAlpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = bikeAlpha;
    ctx.strokeStyle = muted; ctx.lineWidth = 0.025 * s;
    for (const c of [BIKE.rear, BIKE.front]) { ctx.beginPath(); ctx.arc(X(c), Y(c), BIKE.wheel * s, 0, 2 * Math.PI); ctx.stroke(); }
    const head = P(0.5, 0.9);
    line([BIKE.rear, BIKE.crank, BIKE.seat, BIKE.rear]);
    line([BIKE.seat, head, BIKE.crank]);
    line([head, BIKE.front]);
    line([head, BIKE.bar]);
    line([P(BIKE.seat.x - 0.1, BIKE.seat.y), P(BIKE.seat.x + 0.08, BIKE.seat.y)]);
    ctx.beginPath(); ctx.arc(X(BIKE.crank), Y(BIKE.crank), BIKE.crankR * s, 0, 2 * Math.PI);
    ctx.globalAlpha = bikeAlpha * 0.35; ctx.stroke();
    ctx.restore();
  }

  const limbW = 0.06 * s;
  ctx.strokeStyle = fig;
  // far limbs, faded for depth
  ctx.globalAlpha = 0.45; ctx.lineWidth = limbW;
  for (const i of [0, 2]) line([pose.limbs[i].a, pose.limbs[i].j, pose.limbs[i].b]);
  // torso + near limbs
  ctx.globalAlpha = 1;
  ctx.lineWidth = limbW * 1.25;
  line([pose.hip, pose.neck]);
  ctx.lineWidth = limbW;
  for (const i of [1, 3]) line([pose.limbs[i].a, pose.limbs[i].j, pose.limbs[i].b]);

  // ===== HEAD (placeholder: plain circle, or HEAD_PHOTO clipped to the circle) =====
  const hx = X(pose.head), hy = Y(pose.head), hr = L.head * s;
  const headImg = player.photo;
  if (headImg && headImg.complete && headImg.naturalWidth) {
    ctx.save();
    ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 2 * Math.PI); ctx.clip();
    const side = Math.min(headImg.naturalWidth, headImg.naturalHeight);
    ctx.drawImage(headImg, (headImg.naturalWidth - side) / 2, (headImg.naturalHeight - side) / 2, side, side,
                  hx - hr, hy - hr, 2 * hr, 2 * hr);
    ctx.restore();
    ctx.lineWidth = 0.02 * s; ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 2 * Math.PI); ctx.stroke();
  } else {
    ctx.fillStyle = fig;
    ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 2 * Math.PI); ctx.fill();
  }
}

function drawPlot() {
  const cv = $("plot"), ctx = cv.getContext("2d");
  const dpr = fitCanvas(cv);
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const fontPx = Math.round(13 * dpr);
  ctx.font = `${fontPx}px system-ui, sans-serif`;
  const padL = 34 * dpr, padR = 8 * dpr, padT = 6 * dpr, padB = 22 * dpr;
  const pw = W - padL - padR, ph = H - padT - padB;
  if (pw <= 0 || ph <= 0) return;

  let maxMag = 0;
  for (const r of raw) maxMag = Math.max(maxMag, r.mag);
  const yMax = maxMag <= 3 ? 3 : maxMag <= 4 ? 4 : maxMag <= 8 ? 8 : 16;
  const yStep = yMax <= 4 ? 1 : yMax <= 8 ? 2 : 4;
  const span = CONFIG.plotSeconds * 1000;
  const newest = raw.length ? raw[raw.length - 1].t : 0;
  const X = (t) => padL + pw * (1 - (newest - t) / span);
  const Y = (g) => padT + ph * (1 - g / yMax);

  // recessive grid + labels
  ctx.strokeStyle = css("--border"); ctx.lineWidth = dpr;
  ctx.fillStyle = css("--text-2");
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let g = 0; g <= yMax; g += yStep) {
    ctx.beginPath(); ctx.moveTo(padL, Y(g)); ctx.lineTo(padL + pw, Y(g)); ctx.stroke();
    ctx.fillText(String(g), padL - 6 * dpr, Y(g));
  }
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (const [sec, txt] of [[-10, "−10 s"], [-5, "−5 s"], [0, "now"]]) {
    const x = padL + pw * (1 + sec / CONFIG.plotSeconds);
    ctx.textAlign = sec === -10 ? "left" : sec === 0 ? "right" : "center";
    ctx.fillText(txt, x, padT + ph + 6 * dpr);
  }

  if (raw.length < 2) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(padL, padT, pw, ph); ctx.clip();
  ctx.strokeStyle = css("--series-1"); ctx.lineWidth = 2 * dpr;
  ctx.lineJoin = "round";
  ctx.beginPath();
  raw.forEach((r, i) => (i ? ctx.lineTo(X(r.t), Y(r.mag)) : ctx.moveTo(X(r.t), Y(r.mag))));
  ctx.stroke();
  ctx.restore();
}

// ---------------- animation loop ----------------
let last = performance.now();
let phase = 0, cadSmooth = 0;
let shownPose = "standing", fromPose = null, blendStart = 0;
let bikeAlpha = 0;
let lastPanel = 0;

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;

  const name = poseName(now);
  const fresh = predFresh(now);
  const target = name === "standing" ? 0
    : (fresh && pred.cadence_hz > 0 ? pred.cadence_hz : DEFAULT_CADENCE[pred?.model2] ?? 1);
  cadSmooth += (target - cadSmooth) * (1 - Math.exp(-dt / CONFIG.cadenceTauS));
  phase += (name === "standing" ? 0.25 : Math.max(cadSmooth, 0.3)) * dt;

  let pose = POSES[name](phase);
  if (name !== shownPose) {
    fromPose = lastDrawn ?? pose;
    shownPose = name; blendStart = now;
  }
  const k = Math.min(1, (now - blendStart) / CONFIG.blendMs);
  if (fromPose && k < 1) pose = lerpPose(fromPose, pose, k * k * (3 - 2 * k));
  lastDrawn = pose;

  bikeAlpha += ((name === "bike" ? 1 : 0) - bikeAlpha) * (1 - Math.exp(-dt / 0.25));
  drawAvatar(pose, bikeAlpha);
  drawPlot();
  if (now - lastPanel > 100) { updatePanels(now); lastPanel = now; }
  requestAnimationFrame(frame);
}
let lastDrawn = null;
</script>
</body>
</html>
